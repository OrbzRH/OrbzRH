<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  body { height: 420px; }
  .wrap { position: relative; height: 420px; overflow: hidden; text-align: center; }
  .bg { position: absolute; inset: 0; background: url(art/trails.webp) center 40% / cover; }
  .shade { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(20,19,18,.55) 0%, rgba(20,19,18,.92) 75%); }
  .frame { position: absolute; inset: 28px; }
  .copy { position: relative; padding-top: 92px; }
  .mark { width: 64px; height: 64px; margin: 0 auto 20px; background: url(art/orb.png) center / contain no-repeat; }
  h2 { font-family: "Fraunces", serif; font-style: italic; font-weight: 400; font-size: 64px; }
  h2 em { color: var(--ember); }
  .links { margin-top: 22px; font-family: "JetBrains Mono", monospace; font-size: 16px; letter-spacing: .08em; color: var(--marble); display: flex; justify-content: center; gap: 34px; }
  .warn { margin-top: 26px; font-size: 15px; color: var(--vein); }
  .warn b { color: var(--ember-glow); font-weight: 600; }
</style></head>
<body><div class="wrap grain">
  <div class="bg"></div><div class="shade"></div>
  <div class="frame plate"><i class="tick-b"></i></div>
  <div class="copy">
    <div class="mark"></div>
    <h2>Use it, or it <em>burns.</em></h2>
    <div class="links"><span>orbz.app</span><span>use.orbz.app</span><span>api.orbz.app/v1</span><span>x.com/OrbzRH</span><span>github.com/OrbzRH</span></div>
    <div class="warn"><b>Official CA: 0x6a043193D37872A958aAbbC0C7221541f5661BD0</b> Any other address is fake.</div>
  </div>
</div></body></html>
